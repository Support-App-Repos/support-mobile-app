<!DOCTYPE html>

<html
  lang="en"
  xmlns:o="urn:schemas-microsoft-com:office:office"
  xmlns:v="urn:schemas-microsoft-com:vml"
>
  <head>
    <title></title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!--[if mso]>
      <xml>
        <o:OfficeDocumentSettings>
          <o:PixelsPerInch>96</o:PixelsPerInch>
          <o:AllowPNG />
        </o:OfficeDocumentSettings> </xml
    ><![endif]-->
    <style>
      * {
        box-sizing: border-box;
      }

      .green-btn {
        background: #07a854;
        border-radius: 10px;
        padding: 13px 26px;
        display: inline;
        color: white !important;
        text-decoration: none;
      }

      .highlight {
        color: #632ddd !important;
      }

      th.column {
        padding: 0;
      }

      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: inherit !important;
      }

      #MessageViewBody a {
        color: inherit;
        text-decoration: none;
      }

      p {
        line-height: inherit;
        color: inherit !important;
      }

      @media (max-width: 520px) {
        .icons-inner {
          text-align: center;
        }

        .icons-inner td {
          margin: 0 auto;
        }

        .row-content {
          width: 100% !important;
        }

        .image_block img.big {
          width: auto !important;
        }

        .stack .column {
          width: 100%;
          display: block;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      color: #515759;
    "
  >
    <table
      border="0"
      cellpadding="0"
      cellspacing="0"
      class="nl-container"
      role="presentation"
      style="
        mso-table-lspace: 0;
        mso-table-rspace: 0;
        background: url('{{baseUrl}}/email/opaque-logo.png') 100% 100px/ 169px no-repeat #fafafa;
        padding-top: 38px;
        padding-bottom: 88px;
        color: #515759;
      "
      width="100%"
    >
      <tbody>
        <tr>
          <td>
            <div
              style="
                padding-bottom: 22px;
                color: #0c1014;
                font-family: Inter, Arial, Helvetica Neue, Helvetica, sans-serif;
                font-weight: 400;
                font-size: 28px;
                line-height: 59px;
                padding-right: 57px;
                padding-left: 57px;
                margin-top: 42px;
              "
            >
              {{{title}}}
              <!-- <img
                src="{{baseUrl}}/assets/logo.png"
                alt="Logo"
                style="height: 40px; margin-right: 10px"
              /> -->
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding-bottom: 10px">
            <table
              border="0"
              cellpadding="0"
              cellspacing="0"
              class="nl-container"
              role="presentation"
              style="
                background: #ffffff;
                box-shadow: 0px 4px 30px rgba(0, 0, 0, 0.01);
                border-radius: 8px;
                mso-table-lspace: 0;
                mso-table-rspace: 0;
                margin-right: 57px;
                margin-left: 57px;
                margin-top: 38px;
                padding: 16px 34px 34px 34px;
              "
              width="90%"
            >
              <tbody>
                <!-- {{#mainImage}}
                <tr>
                  <td>
                    <div style="padding-bottom: 10px">
                      <img
                        class="big"
                        src="{{mainImage}}"
                        style="
                          display: block;
                          height: auto;
                          border: 0;
                          max-width: 100%;
                          width: 100%;
                        "
                      />
                    </div>
                  </td>
                </tr> -->
                <!-- {{/mainImage}} -->

                <tr>
                  <td>
                    <div
                      style="
                        color: #515759;
                        font-weight: 400;
                        font-size: 18px;
                        line-height: 27px;
                        padding-top: 22px;
                        font-family: Inter, Arial, Helvetica Neue, Helvetica,
                          sans-serif;
                      "
                    >
                      {{{content}}}
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>

        <tr>
          <td>
            <div style="font-family: Inter, sans-serif">
              <div
                style="
                  font-size: 14px;
                  color: #555555;
                  line-height: 1.2;
                  font-family: Inter, Arial, Helvetica Neue, Helvetica,
                    sans-serif;
                "
              >
                <p style="text-align: center">
                  Thank you for being part of the
                  <strong>Youzell.</strong> community.
                </p>
                <br />
              </div>
            </div>
          </td>
        </tr>
        <tr>
          <td>
            <!-- <div style="text-align: center; margin-top: 20px">
              <img
                class="big"
                src="{{baseUrl}}/assets/facebook.png"
                style="height: auto; border: 0; max-width: 100%"
              />

              <img
                class="big"
                src="{{baseUrl}}/assets/twitter.png"
                style="
                  height: auto;
                  border: 0;
                  max-width: 100%;
                  margin-left: 32px;
                "
              />

              <img
                class="big"
                src="{{baseUrl}}/assets/instagram.png"
                style="
                  height: auto;
                  border: 0;
                  max-width: 100%;
                  margin-left: 32px;
                "
              />
            </div> -->
          </td>
        </tr>
      </tbody>
    </table>
    <!-- End -->
  </body>
</html>
